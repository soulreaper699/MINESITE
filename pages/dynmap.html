<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VOXEL | Dynmap</title>
<link rel="stylesheet" href="../shared.css">
<style>
body{background:#0a0a0f;}
.dynmap-wrap{padding:70px 0 0;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
h1{font-family:'Press Start 2P',cursive;font-size:0.8rem;color:#55ff55;text-shadow:2px 2px 0 #003300;margin:20px 0 10px;}
.map-controls{display:flex;gap:10px;margin-bottom:12px;align-items:center;}
.biome-legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
.legend-item{display:flex;align-items:center;gap:4px;font-family:'Press Start 2P',cursive;font-size:0.35rem;}
.legend-dot{width:12px;height:12px;image-rendering:pixelated;}
#map-canvas{border:3px solid #555;border-top-color:#888;border-left-color:#888;image-rendering:pixelated;cursor:none;box-shadow:0 0 40px rgba(85,255,85,0.1);}
#map-tooltip{position:fixed;background:#111;border:1px solid var(--mc-gold);font-family:'VT323',monospace;font-size:1rem;padding:4px 10px;pointer-events:none;opacity:0;transition:opacity 0.1s;z-index:100;}
.map-coords{font-family:'VT323',monospace;font-size:1.2rem;color:rgba(255,255,255,0.5);margin-top:8px;}
</style>
</head>
<body>
<nav class="mc-nav">
  <a class="mc-nav-logo" href="../index.html">VOXEL</a>
  <div class="mc-nav-links">
    <a href="../index.html">PORTAL ROOM</a>
    <a href="dynmap.html" class="active">DYNMAP</a>
  </div>
</nav>
<div id="map-tooltip"></div>
<div class="dynmap-wrap">
  <h1>🗺 LIVE WORLD MAP</h1>
  <div class="biome-legend" id="legend"></div>
  <div class="map-controls">
    <button class="mc-btn" id="btn-regen">♻ REGENERATE WORLD</button>
    <button class="mc-btn green" id="btn-zoom-in">+ ZOOM</button>
    <button class="mc-btn red"   id="btn-zoom-out">– ZOOM</button>
  </div>
  <canvas id="map-canvas" width="768" height="512"></canvas>
  <div class="map-coords" id="map-coords">X:0 Z:0 — Hover to explore</div>
</div>
<script src="../sounds.js"></script>
<script src="../shared.js"></script>
<script>
const BIOMES = [
  {name:'Deep Dark',      colors:['#0a0a1a','#0d0d24','#090917'], prob:0.06},
  {name:'Ocean',          colors:['#0a3d6b','#0c4a80','#083060'], prob:0.12},
  {name:'Plains',         colors:['#4a9c2f','#5fb33a','#3d8226'], prob:0.15},
  {name:'Forest',         colors:['#2a6b1a','#337720','#1f5213'], prob:0.12},
  {name:'Desert',         colors:['#c8a84b','#d4b456','#bba040'], prob:0.10},
  {name:'Taiga',          colors:['#2a5a3a','#315e40','#22482f'], prob:0.08},
  {name:'Swamp',          colors:['#2d4a1a','#344f20','#253e14'], prob:0.07},
  {name:'Mountains',      colors:['#6a6a6a','#7a7a7a','#595959'], prob:0.08},
  {name:'Nether',         colors:['#6e1a00','#7a2200','#5c1400'], prob:0.05},
  {name:'The End',        colors:['#1a0e2e','#200f38','#150b24'], prob:0.04},
  {name:'Mushroom',       colors:['#7a1a7a','#8a228a','#6a1268'], prob:0.03},
  {name:'Badlands',       colors:['#cc7722','#d48432','#b86a18'], prob:0.05},
  {name:'Frozen',         colors:['#c8dde8','#d4e4f0','#bcd0dc'], prob:0.05},
];

const canvas = document.getElementById('map-canvas');
const ctx    = canvas.getContext('2d');
let cellSize = 4;
const COLS = canvas.width  / cellSize;
const ROWS = canvas.height / cellSize;
let map = [];

// Simple noise using hash
function hash(x, y, seed) {
  let h = seed + x*374761393 + y*668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 0xFFFFFFFF;
}

function smooth(x, y, seed, scale) {
  const ix = Math.floor(x/scale), iy = Math.floor(y/scale);
  const fx = (x/scale)-ix, fy = (y/scale)-iy;
  const a = hash(ix,iy,seed), b = hash(ix+1,iy,seed);
  const c = hash(ix,iy+1,seed), d = hash(ix+1,iy+1,seed);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;
}

function getBiome(noise1, noise2, noise3) {
  if (noise1 < 0.12) return BIOMES[0]; // Deep Dark
  if (noise1 < 0.28) return BIOMES[1]; // Ocean
  if (noise3 > 0.75) return BIOMES[8]; // Nether pockets
  if (noise3 > 0.85) return BIOMES[9]; // End pockets
  if (noise2 > 0.7 && noise1 > 0.5) return BIOMES[7]; // Mountains
  if (noise2 < 0.25 && noise1 > 0.4) return BIOMES[4]; // Desert
  if (noise1 > 0.6 && noise2 > 0.4 && noise2 < 0.6) return BIOMES[3]; // Forest
  if (noise1 > 0.7) return BIOMES[5]; // Taiga
  if (noise2 < 0.35 && noise1 > 0.3) return BIOMES[2]; // Plains
  if (noise2 > 0.55 && noise1 < 0.4) return BIOMES[6]; // Swamp
  if (noise3 > 0.6 && noise2 < 0.45) return BIOMES[11]; // Badlands
  if (noise1 > 0.55 && noise2 > 0.65) return BIOMES[12]; // Frozen
  if (noise3 > 0.5 && noise1 > 0.45) return BIOMES[10]; // Mushroom
  return BIOMES[2]; // Plains default
}

let seed = Math.random()*9999|0;

function generateMap() {
  map = [];
  const imgData = ctx.createImageData(canvas.width, canvas.height);
  for (let row=0; row<ROWS; row++) {
    map[row] = [];
    for (let col=0; col<COLS; col++) {
      const n1 = smooth(col, row, seed,    8);
      const n2 = smooth(col, row, seed+111,6);
      const n3 = smooth(col, row, seed+222,12);
      const biome = getBiome(n1, n2, n3);
      const colorIdx = Math.floor(n3*3) % 3;
      const hex = biome.colors[colorIdx];
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      map[row][col] = biome;
      for (let dy=0; dy<cellSize; dy++) for (let dx=0; dx<cellSize; dx++) {
        const pi = ((row*cellSize+dy)*canvas.width + (col*cellSize+dx))*4;
        imgData.data[pi]   = r; imgData.data[pi+1] = g;
        imgData.data[pi+2] = b; imgData.data[pi+3] = 255;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Draw player dot
  const px = Math.floor(COLS/2), py = Math.floor(ROWS/2);
  ctx.fillStyle='#fff'; ctx.fillRect(px*cellSize-2, py*cellSize-2, 6, 6);
  ctx.fillStyle='#f00'; ctx.fillRect(px*cellSize-1, py*cellSize-1, 4, 4);
}

// Legend
const legendEl = document.getElementById('legend');
BIOMES.forEach(b => {
  const div = document.createElement('div');
  div.className = 'legend-item';
  div.innerHTML = `<div class="legend-dot" style="background:${b.colors[0]}"></div>${b.name}`;
  legendEl.appendChild(div);
});

// Tooltip
const tooltip  = document.getElementById('map-tooltip');
const coordsEl = document.getElementById('map-coords');
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const col = Math.floor((e.clientX-rect.left)/cellSize);
  const row = Math.floor((e.clientY-rect.top)/cellSize);
  if (col>=0&&col<COLS&&row>=0&&row<ROWS&&map[row]) {
    const biome = map[row][col];
    const wx = (col - COLS/2)*8, wz = (row - ROWS/2)*8;
    tooltip.textContent = `${biome.name} — X:${Math.round(wx)} Z:${Math.round(wz)}`;
    tooltip.style.opacity='1'; tooltip.style.left=(e.clientX+12)+'px'; tooltip.style.top=(e.clientY-20)+'px';
    coordsEl.textContent = `X:${Math.round(wx)} Z:${Math.round(wz)} — ${biome.name}`;
  }
});
canvas.addEventListener('mouseleave', () => { tooltip.style.opacity='0'; });
document.getElementById('btn-regen').addEventListener('click', () => { seed=Math.random()*9999|0; generateMap(); });
document.getElementById('btn-zoom-in').addEventListener('click', () => { if(cellSize<12){cellSize+=2;generateMap();} });
document.getElementById('btn-zoom-out').addEventListener('click', () => { if(cellSize>2){cellSize-=2;generateMap();} });
generateMap();
</script>
</body>
</html>
